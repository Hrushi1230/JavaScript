<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <p>Amazon Shipping Calculator</p>
    <p>Order under $40 =+$10 shipping.</p>
    <p>Order $40 or more = Free shipping.</p>


        <input placeholder="Cost of Order" class="js-cost" 
        onkeydown="
            if(event.key === 'Enter'){
                result();
            }">
        <button onclick="
        result();
        ">calculate</button>
    
    <p class="js-result"></p>

    <script>
        
        function result () {
            const input = document.querySelector('.js-cost');
            let cost = Number(input.value);
            cost=cost*100;
            if( cost < 40 ) {
                document.querySelector('.js-result').innerHTML= `$${(cost + 1000)/100}`;
            }else{
                document.querySelector('.js-result').innerHTML=`$${cost/100}`;
            }

           
        }
        
        
       
    </script>
</body>
</html>
