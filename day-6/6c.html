<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>js-6c</title>
</head>
<body>
    <input placeholder="Enter your name" class="name-js"
    onkeydown="Clickdown(event);"
    
    >
    <button onclick="
    Result()">submit</button>
    <p class="js-result"></p>

    <script>
        function Result(){
            const input =document.querySelector('.name-js');
            let name=input.value;
            document.querySelector('.js-result').innerHTML=`Your name is : ${name}`;
        }
        function Clickdown(event){
            if(event.key ==='Enter'){
                Result();
            }
        }


    </script>
    
</body>
</html>
