<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-4</title>
</head>
<body>
    <h1>Welcome to Day 4</h1>

    <script>
        function greet(name){
            if(!name){
                console.log(`Hello there!`);
            }
            else{
                console.log(`Hello ${name}!`);
            }
        }
        greet("Bapa");
        greet("Maa")
        greet();
        greet("Pratap");
    </script>
    
</body>
</html>
