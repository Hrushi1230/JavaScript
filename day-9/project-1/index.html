<!DOCTYPE html>
<html lang="en">
<head>

    <title>Rock Paper Scissors</title>
    <style>
        body{
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }
         .img-icon{
            height :50px;
        }
        .btn{
            height: 120px;
            width: 120px;
            border-radius:60px;
            background-color: transparent;
            margin-right: 10px;
            border: solid white 3px;
            cursor: pointer;
        }
        .title{
            font-size: 30px;
            font-weight: bold;
        }

        .js-result{
            font-size: 25px;
            font-weight: bold;
            margin-top: 50px;


        }
        .js-score{
            margin-top:60px;

        }
        .reset-btn ,.auto-btn{
            background-color: white;
            border: none;
            font-size: 15;
            padding: 8px 15px;
            cursor: pointer;
        }

       
    </style>
   
</head>
<body>
    <p class="title">Rock Paper Scissors Game</p>

    <button 
     class="btn rock-btn"><img src="./image/Rock-emoji.png" class="img-icon" ></button>

    <button class="btn paper-btn"
    ><img src="./image/Paper-emoji.png" class="img-icon"></button>

    <button class="btn scissors-btn" 
    ><img src="./image/Scissors-emoji.png"class="img-icon"></button>

    <p class="js-result"></p>

    <p class="js-moves">
        You
        <img src="./image/Paper-emoji.png" class="img-icon">
        <img src="./image/Rock-emoji.png" class="img-icon">
        Computer
    </p>
    
    <p class="js-score"></p>



    <button onclick="
        resetGame();
    " class="reset-btn">
    Reset Game

    </button>
    <button onclick="
        autoPlay();
    " class="auto-btn">
    Auto Play

    </button>
    <script src="index.js"></script>

    
</body>
</html>
