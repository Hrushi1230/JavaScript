<!DOCTYPE html>

<body>
    <script>
        function countWords(words){
            let ans ={};
            for(let i=0;i<words.length;i++){
                if(ans[words[i]]){
                    ans[words[i]]+=1;
                }
                else{
                    ans[words[i]]=1;
                }
            }
            console.log(ans);
        }
        countWords(['apple','grape','apple']);
    </script>
    
</body>
