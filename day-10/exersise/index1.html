<!DOCTYPE html>

<body>
    <script>
        function countPositive(nums){
            let count = 0;
            nums.forEach(function(value) {
                count += (value > 0) ? 1 : 0;
            });
            console.log(count);
        }
        countPositive([1,-3,5]);
        countPositive([-2,3,-5,7,10]);
    </script>
    
</body>
